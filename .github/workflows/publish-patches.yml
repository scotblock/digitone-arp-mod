name: Publish stock-dependent patch packages
on:
  push:
    tags:
      - 'patches-*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the patcher without firmware
        run: python3 -m unittest discover -s release-tools -p test_patcher.py -v
      - name: Assemble and check download packages
        run: python3 release-tools/package_release.py --output dist
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "OS 1.44 experimental arp patch packages" \
            --notes-file docs/PATCH_RELEASE.md \
            dist/*.zip dist/SHA256SUMS.txt
